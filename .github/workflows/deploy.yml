name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
      - 'astro.config.mjs'
      - 'wrangler.toml'
      - 'package.json'
      - 'blog-calendar.json'

permissions:
  contents: read

concurrency:
  group: mtc-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: main
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact merged source identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SOURCE_COMMIT must be a full 40-character Git SHA."
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$SOURCE_COMMIT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run test:seo-automation
      - name: Build (fetch live Google reviews)
        env:
          FORGE_REVIEWS_API_BASE: ${{ vars.FORGE_REVIEWS_API_BASE || 'https://reviews.forge-co.ca' }}
          PUBLIC_RELEASE_COMMIT: ${{ github.sha }}
          PUBLIC_RELEASE_BRANCH: main
        run: npm run build

      # Pre-deploy guard: verify build matches MTC, not another site
      - name: Verify build output is MTC
        run: |
          TITLE=$(grep -o '<title>[^<]*</title>' dist/index.html | head -1 | sed 's/<[^>]*>//g')
          echo "Build title: $TITLE"
          if ! echo "$TITLE" | grep -qi "MTC Renovations"; then
            echo "::error::Build title '$TITLE' does not match MTC Renovations. BLOCKING deploy to prevent cross-contamination."
            exit 1
          fi

      - name: Capture last-known-good production deployment
        id: last_known_good
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "deployment_id=$(node scripts/post-deploy-safety.mjs capture)" >> "$GITHUB_OUTPUT"

      - uses: cloudflare/wrangler-action@v3
        id: deploy_pages
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=mtc-renovations --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false

      - name: Verify production critically
        id: production_verify
        run: node scripts/post-deploy-safety.mjs verify --expected-commit=${{ github.sha }}

      - name: Roll back to last-known-good deployment
        id: rollback
        if: ${{ failure() && steps.deploy_pages.outcome == 'success' && steps.production_verify.outcome == 'failure' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/post-deploy-safety.mjs rollback --deployment-id=${{ steps.last_known_good.outputs.deployment_id }}

      - name: Verify restored production
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        run: node scripts/post-deploy-safety.mjs verify --profile=baseline

      - name: IndexNow (production URLs)
        if: success()
        continue-on-error: true
        env:
          INDEXNOW_HOST: www.mtcrenovations.ca
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY_MTC }}
        run: node scripts/submit-indexnow.mjs
